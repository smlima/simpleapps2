<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letrinhas — aprender a escrever</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Playwrite+PT:wght@100..400&display=swap" rel="stylesheet">
<style>
:root{
  --cover:#2F5DA8; --cover-deep:#234886; --paper:#FFFDF6; --ink:#1E2A44;
  --sun:#FFC93C; --leaf:#2FB36A; --leaf-deep:#1E8C50; --muted:#DCE6F7;
  --chip:#3D6CB8; --chip-on:#FFFDF6; --shadow:rgba(10,25,60,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --cover:#16294D; --cover-deep:#0F1F3C; --chip:#22407A; --muted:#B9C8E6; --shadow:rgba(0,0,0,.5); }
}
:root[data-theme="dark"]{ --cover:#16294D; --cover-deep:#0F1F3C; --chip:#22407A; --muted:#B9C8E6; --shadow:rgba(0,0,0,.5); }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{
  margin:0; min-height:100%; background:var(--cover); color:#fff;
  font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
}
button{font:inherit; cursor:pointer; border:0}
button:focus-visible{outline:4px solid var(--sun); outline-offset:3px}

.app{max-width:1100px; margin:0 auto; padding:10px 14px 14px; display:flex; flex-direction:column; gap:10px}

.top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.brand{font-family:"Playwrite PT",cursive; font-weight:400; font-size:1.55rem; line-height:1.6; color:var(--sun); padding-left:4px}
.toggles{display:flex; gap:8px; align-items:center}
.seg{display:flex; background:var(--cover-deep); border-radius:14px; padding:4px}
.seg button{background:transparent; color:var(--muted); font-family:"Playwrite PT",cursive; font-size:1.1rem; min-width:48px; height:42px; border-radius:10px; line-height:1}
.seg button[aria-pressed="true"]{background:var(--paper); color:var(--ink)}
.icon-btn{background:var(--cover-deep); color:#fff; height:50px; min-width:50px; border-radius:14px; font-size:1.35rem; padding:0 10px}
.icon-btn[aria-pressed="false"]{opacity:.55}

.letters{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; scroll-snap-type:x proximity; scrollbar-width:none}
.letters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto; scroll-snap-align:center; width:60px; height:72px; border-radius:16px; background:var(--chip); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; transition:transform .15s}
.chip .l{font-family:"Playwrite PT",cursive; font-size:1.45rem; line-height:1.5}
.chip .s{font-size:.7rem; letter-spacing:1px; color:var(--sun); height:14px; line-height:14px}
.chip[aria-current="true"]{background:var(--chip-on); color:var(--ink); transform:translateY(-3px); box-shadow:0 6px 0 var(--sun)}

.word{display:flex; align-items:center; justify-content:center; gap:12px; min-height:56px}
.word .emoji{font-size:2.4rem; line-height:1}
.word .w{font-family:"Playwrite PT",cursive; font-size:1.5rem; line-height:1.9}
.word .w b{color:var(--sun); font-weight:400}
.word .say{background:var(--sun); color:var(--ink); width:48px; height:48px; border-radius:50%; font-size:1.3rem}

.reps{display:flex; justify-content:center; gap:10px}
.rep{width:60px; height:62px; border-radius:16px; background:var(--cover-deep); border:3px dashed var(--muted); color:var(--muted); display:flex; flex-direction:column; align-items:center; justify-content:center}
.rep .l{font-family:"Playwrite PT",cursive; font-size:1.35rem; line-height:1.4}
.rep .s{font-size:.65rem; letter-spacing:1px; color:var(--sun); height:12px; line-height:12px}
.rep.current{border:3px solid var(--sun); color:#fff}
.rep.done{background:var(--leaf); border:3px solid var(--leaf); color:#fff}
.rep.done .s{color:#fff}
.rep.locked{visibility:hidden}
.reps.enter .rep:nth-child(n+2){animation:drop .5s cubic-bezier(.3,1.6,.5,1) both}
.reps.enter .rep:nth-child(3){animation-delay:.15s}
.reps.enter .rep:nth-child(4){animation-delay:.3s}
@keyframes drop{from{transform:translateY(-24px) scale(.4); opacity:0}to{transform:none; opacity:1}}
.rep.done.just{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}

.board{
  position:relative; margin:0 auto; width:min(100%, calc((100vh - 400px) * 10 / 9));
  width:min(100%, calc((100dvh - 400px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 10 / 9));
  min-width:min(100%,280px); aspect-ratio:10/9; border-radius:20px; overflow:hidden;
  background:var(--paper); box-shadow:0 10px 0 var(--cover-deep), 0 18px 30px var(--shadow);
}
.board canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
#ink{touch-action:none; cursor:crosshair}
#fx{pointer-events:none}
.board.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}

.bubble{position:absolute; left:50%; top:14px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:8px 16px; border-radius:16px; font-size:1.05rem; font-weight:700; max-width:88%; text-align:center; opacity:0; transition:opacity .2s; pointer-events:none}
.bubble.on{opacity:1}

.result{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; background:rgba(255,253,246,.72); color:var(--ink); text-align:center; padding:16px}
.result[hidden]{display:none}
.stars{display:flex; gap:6px; font-size:clamp(2.6rem,11vw,4.6rem); line-height:1}
.stars span{color:#D9DEE8; transform:scale(0)}
.stars span.on{color:var(--sun); text-shadow:0 3px 0 #D99A00}
.result.show .stars span{animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards}
.result.show .stars span:nth-child(2){animation-delay:.15s}
.result.show .stars span:nth-child(3){animation-delay:.3s}
@keyframes pop{to{transform:scale(1)}}
.result p{margin:0; font-size:clamp(1.3rem,5vw,1.9rem); font-weight:800}
.result .row{display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; justify-content:center}
.btn{height:56px; padding:0 22px; border-radius:18px; font-weight:800; font-size:1.15rem; background:var(--muted); color:var(--ink)}
.btn.primary{background:var(--leaf); color:#fff; box-shadow:0 5px 0 var(--leaf-deep)}
.btn.primary:active{transform:translateY(3px); box-shadow:0 2px 0 var(--leaf-deep)}

.tools{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.crayons{display:flex; gap:8px}
.crayon{width:40px; height:48px; border-radius:10px 10px 6px 6px; position:relative; background:var(--c); box-shadow:inset 0 -8px 0 rgba(0,0,0,.18)}
.crayon::before{content:""; position:absolute; left:50%; top:-12px; transform:translateX(-50%); border:10px solid transparent; border-bottom:12px solid var(--c); border-top:0}
.crayon[aria-pressed="true"]{transform:translateY(-8px)}
.actions{display:flex; gap:10px; margin-left:auto}
.btn.erase{background:var(--cover-deep); color:#fff}

@media (max-width:520px){
  .crayon{width:32px; height:42px}
  .btn{height:52px; padding:0 16px; font-size:1.05rem}
  .brand{font-size:1.25rem}
  .rep{width:52px; height:56px}
}
@media (prefers-reduced-motion:reduce){
  .board.shake{animation:none}
  .result.show .stars span{animation:none; transform:scale(1)}
  .chip{transition:none}
  .reps.enter .rep, .rep.done.just{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Letrinhas</div>
    <div class="toggles">
      <div class="seg" role="group" aria-label="Maiúsculas ou minúsculas">
        <button id="upperBtn" aria-pressed="true" aria-label="Maiúsculas">A</button>
        <button id="lowerBtn" aria-pressed="false" aria-label="Minúsculas">a</button>
      </div>
      <button class="icon-btn" id="helpBtn" aria-pressed="true" title="Mostrar o caminho da letra" aria-label="Mostrar o caminho da letra">👁️</button>
      <button class="icon-btn" id="voiceBtn" aria-pressed="true" title="Voz" aria-label="Voz">🗣️</button>
    </div>
  </header>

  <nav class="letters" id="letters" aria-label="Escolher letra"></nav>

  <div class="word">
    <span class="emoji" id="emoji">🐝</span>
    <span class="w" id="word"></span>
    <button class="say" id="sayBtn" aria-label="Ouvir a letra">🔊</button>
    <button class="say" id="demoBtn" aria-label="Ver como se faz">▶</button>
  </div>

  <div class="reps" id="reps" role="status"></div>

  <div class="board" id="board">
    <canvas id="bg"></canvas>
    <canvas id="ink"></canvas>
    <canvas id="fx"></canvas>
    <div class="bubble" id="bubble" aria-live="polite"></div>
    <div class="result" id="result" hidden>
      <div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div>
      <p id="resultText">Boa!</p>
      <div class="row">
        <button class="btn" id="againBtn">Outra vez</button>
        <button class="btn primary" id="nextBtn">Próxima letra</button>
      </div>
    </div>
  </div>

  <footer class="tools">
    <div class="crayons" id="crayons" aria-label="Cor do lápis"></div>
    <div class="actions">
      <button class="btn erase" id="clearBtn">🧽 Apagar</button>
      <button class="btn primary" id="checkBtn">✔ Já está!</button>
    </div>
  </footer>
</div>

  computeMetrics(maxX - minX);

function sample(){
  const d = wctx.getImageData(0,0,W,H).data;
  const out = [];
  for (let y = 0; y < H; y += STEP) for (let x = 0; x < W; x += STEP){
    if (d[(y*W + x)*4 + 3] > 40) out.push(y*W + x);
  }
  return out;
}
const isFree = () => round.stars.length >= 3;   // 4.ª vez: só a folha, sem letra
function buildMasks(T){
  const c = wctx;
  c.clearRect(0,0,W,H); strokeGlyph(c, 10, '#000', T);
  const core = sample();
  c.clearRect(0,0,W,H); strokeGlyph(c, T ? ZONE_W * Math.min(1, Math.max(0.6, T.k / M.k)) : ZONE_W, '#000', T);
  const zone = new Uint8Array(W*H); for (const p of sample()) zone[p] = 1;

}

let demoToken = 0;
function demo(){
  const tok = ++demoToken;
  fctx.clearRect(0,0,W,H);
  const speed = reduceMotion ? 9999 : 300 / M.k;   // unidades por segundo
  let si = 0, t0 = performance.now();
  function frame(now){
    if (tok !== demoToken) return;
    fctx.clearRect(0,0,W,H);
    const elapsed = (now - t0) / 1000;
    fctx.save(); fctx.setTransform(M.k,0,0,M.k,G.ox,M.base);
    fctx.lineCap = 'round'; fctx.lineJoin = 'round'; fctx.lineWidth = 22 / M.k; fctx.strokeStyle = 'rgba(255,201,60,.9)';
    for (let n = 0; n < si; n++) fctx.stroke(G.strokes[n].path);
    const s = G.strokes[si];
    const upto = Math.min(s.L, elapsed * speed + (s.L < 20 ? s.L : 0));
    fctx.beginPath();
    const last = Math.round(upto / s.step);
    for (let i = 0; i <= last && i < s.pts.length; i++){ const p = s.pts[i]; i ? fctx.lineTo(p.x, p.y) : fctx.moveTo(p.x, p.y); }
    fctx.stroke(); fctx.restore();
    const head = toC(pointAt(s, upto));
    fctx.beginPath(); fctx.arc(head.x, head.y, 14, 0, Math.PI*2); fctx.fillStyle = '#E4572E'; fctx.fill();
    fctx.lineWidth = 3; fctx.strokeStyle = '#fff'; fctx.stroke();
    if (upto >= s.L){
      if (si < G.strokes.length - 1){ si++; t0 = now + 250; }
      else { setTimeout(() => { if (tok === demoToken) fctx.clearRect(0,0,W,H); }, 900); return; }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function fitToInk(d){
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (let y = 0; y < H; y += STEP) for (let x = 0; x < W; x += STEP){
    if (d[(y*W + x)*4 + 3] > 40){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  const r = INK_W / 2;
  x0 += r; x1 -= r; y0 += r; y1 -= r;
  const b = G.box, bw = Math.max(1, b.maxX - b.minX), bh = Math.max(1, b.maxY - b.minY);
  let k = (Math.max(1, x1 - x0) / bw + Math.max(1, y1 - y0) / bh) / 2;
  k = Math.min(M.k * 1.5, Math.max(M.k * 0.35, k));
  return { k, ox: (x0 + x1) / 2 - (b.minX + b.maxX) / 2 * k, base: (y0 + y1) / 2 - (b.minY + b.maxY) / 2 * k };
}
function evaluate(){
  const d = ictx.getImageData(0,0,W,H).data;
  const inked = p => d[p*4 + 3] > 40;
  const free = isFree();
  if (free) buildMasks(fitToInk(d)); else buildMasks();
  let covered = 0; const missed = [];
  for (const p of masks.core){ if (inked(p)) covered++; else missed.push(p); }
  let inkN = 0, inside = 0;
  for (let y = 0; y < H; y += STEP) for (let x = 0; x < W; x += STEP){
    const p = y*W + x; if (inked(p)){ inkN++; if (masks.zone[p]) inside++; }
  }
  const coverage = masks.core.length ? covered / masks.core.length : 0;
  const precision = inkN ? inside / inkN : 0;
  const minC = free ? 0.55 : MIN_COVER, minP = free ? 0.62 : MIN_PREC;
  const ok = coverage >= minC && precision >= minP;
  const stars = !ok ? 0 : (coverage >= minC + 0.2 && precision >= minP + 0.15) ? 3 : (coverage >= minC + 0.1 && precision >= minP + 0.07) ? 2 : 1;
  return { ok, stars, coverage, precision, missed, free, minP };
}

let ac = null, master = null;
function audio(){
  if (!ac){
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    ac = new AC();
    const comp = ac.createDynamicsCompressor();
    master = ac.createGain(); master.gain.value = 0.85;
    master.connect(comp); comp.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone({ type='sine', f0, f1, t=0, dur=.3, vol=.3, vib=0, vibRate=0, vibEnd, filter }){
  const a = audio(); if (!a) return;
  const now = a.currentTime + t;
  const o = a.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, now);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, now + dur * 0.9);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(vol, now + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  if (vib){
    const l = a.createOscillator(), lg = a.createGain();
    l.frequency.value = vibRate; lg.gain.setValueAtTime(vib, now);
    if (vibEnd !== undefined) lg.gain.linearRampToValueAtTime(vibEnd, now + dur);
    l.connect(lg); lg.connect(o.frequency); l.start(now); l.stop(now + dur + .05);
  }
  if (filter){
    const f = a.createBiquadFilter(); f.type = filter.type; f.frequency.value = filter.f; f.Q.value = filter.Q || 1;
    o.connect(f); f.connect(g);
  } else o.connect(g);
  g.connect(master); o.start(now); o.stop(now + dur + .05);
}

}
function renderWord(){
  const [L, w, e] = LETTERS[state.i];
  $('emoji').textContent = e;
  $('word').innerHTML = `<b>${state.upper ? w[0] : w[0].toLowerCase()}</b>${w.slice(1)}`;
}
function renderReps(animate){
  const box = $('reps'); box.innerHTML = '';
  const t = ch(), n = round.stars.length;
  for (let k = 0; k < 4; k++){
    const d = document.createElement('div');
    d.className = 'rep';
    if (k < n) d.classList.add('done'); else if (k === n) d.classList.add('current');
    if (k > 0 && n === 0) d.classList.add('locked');
    if (k === n - 1) d.classList.add('just');
    const label = (k === 3 && n < 4) ? '✏️' : t;
    d.innerHTML = `<span class="l">${label}</span><span class="s">${starsText(round.stars[k] || 0)}</span>`;
    box.appendChild(d);
  }
  box.classList.toggle('enter', !!animate && !reduceMotion);
  box.setAttribute('aria-label', n >= 4 ? 'Ronda completa' : `Letra ${n + 1} de 4`);
}
function resetRound(){ round.stars = []; renderReps(); if (G) drawBg(); }
function renderCrayons(){
  const box = $('crayons'); box.innerHTML = '';
  CRAYONS.forEach(col => {
    const b = document.createElement('button');
    b.className = 'crayon'; b.style.setProperty('--c', col);
    b.setAttribute('aria-label', 'Lápis'); b.setAttribute('aria-pressed', String(col === state.color));
    b.onclick = () => { playTap(); state.color = col; renderCrayons(); };
    box.appendChild(b);
  });
}
function renderToggles(){
  $('upperBtn').setAttribute('aria-pressed', String(state.upper));
  $('lowerBtn').setAttribute('aria-pressed', String(!state.upper));
  $('helpBtn').setAttribute('aria-pressed', String(state.help));
  $('voiceBtn').setAttribute('aria-pressed', String(state.voice));
  $('voiceBtn').textContent = state.voice ? '🗣️' : '🤐';
}
let bubbleT = null;
function bubble(text, ms = 2600){
  const b = $('bubble'); b.textContent = text; b.classList.add('on');
  clearTimeout(bubbleT); bubbleT = setTimeout(() => b.classList.remove('on'), ms);
}
function clearInk(){
  demoToken++; ictx.clearRect(0,0,W,H); fctx.clearRect(0,0,W,H);
  state.hasInk = false; state.locked = false; roundToken++;
  $('result').hidden = true; $('result').classList.remove('show');
}
function refresh(){
  buildGlyph(); drawBg(); buildMasks(); clearInk(); resetRound();
  renderChips(); renderWord(); renderToggles(); saveAll();
}
function goTo(idx, speak){
  state.i = (idx + LETTERS.length) % LETTERS.length;
  refresh(); if (speak) sayLetter();
}

/* ---------- Desenhar com o dedo ---------- */
let drawing = false, last = null;
function pt(e){
  const r = ink.getBoundingClientRect();
  return { x:(e.clientX - r.left) * W / r.width, y:(e.clientY - r.top) * H / r.height };
}
function stroke(a, b){
  ictx.strokeStyle = state.color; ictx.lineWidth = INK_W; ictx.lineCap = 'round'; ictx.lineJoin = 'round';
  ictx.beginPath(); ictx.moveTo(a.x, a.y); ictx.lineTo(b.x, b.y); ictx.stroke();
  state.hasInk = true;
}
ink.addEventListener('pointerdown', e => {
  if (state.locked) return;
  audio(); e.preventDefault();
  try { ink.setPointerCapture(e.pointerId); } catch(_) {}
  demoToken++; drawing = true; last = pt(e); stroke(last, last);
  fctx.clearRect(0,0,W,H);
});
ink.addEventListener('pointermove', e => {
  if (!drawing) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])){ const p = pt(ev); stroke(last, p); last = p; }
});
const stop = () => { drawing = false; };
ink.addEventListener('pointerup', stop);
ink.addEventListener('pointercancel', stop);
ink.addEventListener('pointerleave', stop);

/* ---------- Verificar ---------- */
const PRAISE = ['Muito bem!', 'Fantástico!', 'Que letra tão bonita!', 'Boa, conseguiste!', 'Espetacular!'];
function check(){
  audio();
  if (state.locked) return;
  if (!state.hasInk){ const t = isFree() ? 'Escreve a letra na folha ✏️' : 'Desenha a letra por cima do caminho ✏️'; bubble(t); say(t.replace(/ ✏️/, '.')); return; }
  const r = evaluate();
  if (r.ok){
    state.locked = true;
    round.stars.push(r.stars);
    const n = round.stars.length;
    if (n < 4){
      playSuccess(false); confetti(60);
      renderReps(n === 1);
      const left = 4 - n;
      if (n === 1){ bubble('Boa! Agora faz mais 3 👇', 1900); say('Muito bem! Agora faz mais três.', 650); }
      else if (left === 1){ bubble('Boa! Agora escreve sozinho, sem ajuda! ✏️', 2200); say('Boa! Agora escreve a letra sozinho, sem ajuda!', 650); }
      else { bubble(`Boa! Faltam ${left}!`, 1700); say(`Boa! Faltam ${left}!`, 650); }
      const tok = ++roundToken;
      setTimeout(() => {
        if (tok !== roundToken) return;
        ictx.clearRect(0,0,W,H); state.hasInk = false; state.locked = false;
        if (isFree()) drawBg();
      }, 1800);
      return;
    }
    playSuccess(true); confetti(170);
    renderReps();
    const avg = Math.max(1, Math.round(round.stars.reduce((a, b) => a + b, 0) / 4));
    const k = key(); progress[k] = Math.max(progress[k] || 0, avg); saveAll();
    const phrase = PRAISE[Math.floor(Math.random() * PRAISE.length)];
    $('resultText').textContent = phrase + ' Fizeste as 4!';
    [...$('stars').children].forEach((s, i) => s.classList.toggle('on', i < avg));
    const res = $('result'); res.hidden = false; res.classList.remove('show'); void res.offsetWidth; res.classList.add('show');
    say(phrase, 900);
    renderChips();
  } else {
    playError();
    const board = $('board'); board.classList.remove('shake'); void board.offsetWidth; board.classList.add('shake');
    if (r.free){ bubble('Quase! Tenta outra vez 💪 (podes ver no ▶)'); say('Quase! Tenta outra vez.', 700); }
    else if (r.precision < MIN_PREC){ bubble('Quase! Tenta ficar dentro do caminho 🛤️'); say('Quase! Tenta ficar dentro do caminho.', 700); }
    else { bubble('Falta um bocadinho da letra 👇'); say('Falta um bocadinho da letra.', 700); showMissed(r.missed); }
  }
}
function showMissed(missed){
  fctx.clearRect(0,0,W,H);
  fctx.fillStyle = 'rgba(255,159,28,.85)';
  missed.forEach((p, n) => {
    if (n % 3) return;
    const x = p % W, y = Math.floor(p / W);
    fctx.beginPath(); fctx.arc(x, y, 5, 0, Math.PI*2); fctx.fill();
  });
  setTimeout(() => { if (!state.locked) fctx.clearRect(0,0,W,H); }, 2600);
}

/* ---------- Confetes ---------- */
function confetti(count = 140){
  const cols = ['#FFC93C','#E4572E','#2F80ED','#27AE60','#9B51E0','#E0457B'];
  const n = reduceMotion ? 0 : count;
  const parts = Array.from({ length:n }, () => ({
    x: W/2 + (Math.random() - .5) * 120, y: H * .55,
    vx: (Math.random() - .5) * 22, vy: -12 - Math.random() * 16,
    r: 5 + Math.random() * 7, a: Math.random() * 6, va: (Math.random() - .5) * .4,
    c: cols[Math.floor(Math.random() * cols.length)], round: Math.random() < .35
  }));
  const t0 = performance.now();
  function frame(t){
    fctx.clearRect(0,0,W,H);
    for (const p of parts){
      p.vy += .55; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.a); fctx.fillStyle = p.c;
      if (p.round){ fctx.beginPath(); fctx.arc(0,0,p.r*.6,0,Math.PI*2); fctx.fill(); }
      else fctx.fillRect(-p.r, -p.r/2.5, p.r*2, p.r/1.25);
      fctx.restore();
    }
    if (t - t0 < 2400) requestAnimationFrame(frame); else fctx.clearRect(0,0,W,H);
  }
  if (n) requestAnimationFrame(frame);
}

/* ---------- Botões ---------- */
$('checkBtn').onclick = check;
$('clearBtn').onclick = () => { playTap(); clearInk(); };
$('againBtn').onclick = () => { playTap(); clearInk(); resetRound(); };
$('nextBtn').onclick = () => { playTap(); goTo(state.i + 1, true); };
$('demoBtn').onclick = () => { playTap(); clearInk(); demo(); };
$('sayBtn').onclick = () => { audio(); const v = state.voice; state.voice = true; sayLetter(); state.voice = v; };
$('upperBtn').onclick = () => { playTap(); state.upper = true; refresh(); };
$('lowerBtn').onclick = () => { playTap(); state.upper = false; refresh(); };
$('helpBtn').onclick = () => { playTap(); state.help = !state.help; drawBg(); renderToggles(); saveAll(); };
$('voiceBtn').onclick = () => { playTap(); state.voice = !state.voice; if (!state.voice && 'speechSynthesis' in window) speechSynthesis.cancel(); renderToggles(); saveAll(); };

/* ---------- Arranque (espera pela letra manuscrita) ---------- */
renderCrayons();
const fontLoad = Promise.all([
  document.fonts ? document.fonts.load(`300 100px "Playwrite PT"`) : Promise.resolve(),
  document.fonts ? document.fonts.load(`700 20px "Baloo 2"`) : Promise.resolve()
]).catch(() => {});
Promise.race([fontLoad, new Promise(r => setTimeout(r, 3500))]).then(() => {
  computeMetrics(); refresh();
});
})();
</script>
