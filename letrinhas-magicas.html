<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letrinhas Mágicas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sky:#CFEAFF; --sky2:#E9F6FF; --paper:#FFFFFF; --text:#23304A; --muted:#6A7A96;
  --track:#E7EEF9; --core:#9DB3D6; --rule:#A9CFF2; --margin:#FF9AA0;
  --tomato:#FF5A5F; --sun:#FFC83D; --grass:#2FBF71; --grape:#8B5CF6; --ocean:#2F80ED;
  --btn:#FFFFFF; --edge:#23304A22; --press:#23304A33; --arrow:#5A73A8;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky:#16213A; --sky2:#1D2B4A; --paper:#243457; --text:#F2F6FF; --muted:#A9B7D4;
    --track:#30456F; --core:#6F8AC0; --rule:#3C5A8C; --margin:#9C4A58;
    --btn:#2B3D63; --edge:#00000055; --press:#00000077; --arrow:#C3D2F5;
  }
}
:root[data-theme="dark"]{
  --sky:#16213A; --sky2:#1D2B4A; --paper:#243457; --text:#F2F6FF; --muted:#A9B7D4;
  --track:#30456F; --core:#6F8AC0; --rule:#3C5A8C; --margin:#9C4A58;
  --btn:#2B3D63; --edge:#00000055; --press:#00000077; --arrow:#C3D2F5;
}
body{
  margin:0;min-height:100%;color:var(--text);
  background:var(--sky);
  background-image:radial-gradient(circle at 12% 8%,var(--sky2) 0 90px,transparent 91px),
                   radial-gradient(circle at 88% 20%,var(--sky2) 0 60px,transparent 61px);
  font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
.app{max-width:680px;margin:0 auto;padding:10px 14px 18px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:24px;font-weight:700;flex:1;letter-spacing:.2px}
h1 .cur{color:var(--grape)}
.chip{display:flex;align-items:center;gap:6px;background:var(--btn);padding:6px 12px;border-radius:999px;
  font-weight:700;font-size:18px;box-shadow:0 4px 0 var(--edge)}
.icon{border:0;background:var(--btn);color:var(--text);width:44px;height:44px;border-radius:50%;font-size:22px;
  box-shadow:0 4px 0 var(--edge);cursor:pointer}
.icon:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.tabs{display:flex;gap:8px;justify-content:center}
.tab{flex:1;max-width:140px;border:0;border-radius:16px 16px 6px 6px;padding:10px 0;font:600 20px 'Fredoka',sans-serif;
  background:var(--btn);color:var(--muted);box-shadow:0 4px 0 var(--edge);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--grape);color:#fff;box-shadow:0 4px 0 #5B34C2}
.coach{display:flex;align-items:center;gap:10px}
.mascot{font-size:46px;line-height:1;filter:drop-shadow(0 3px 0 var(--edge))}
.bubble{flex:1;position:relative;background:var(--btn);border-radius:18px;padding:10px 14px;font-size:18px;font-weight:500;
  min-height:48px;display:flex;align-items:center;box-shadow:0 4px 0 var(--edge)}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--btn);border-left:0}
.stage-wrap{width:100%;display:flex;justify-content:center}
#stage{position:relative;background:var(--paper);border-radius:22px;overflow:hidden;touch-action:none;
  box-shadow:0 7px 0 var(--edge);}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#stamp{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%) scale(0);text-align:center;font-size:56px;
  pointer-events:none;opacity:0;text-shadow:0 4px 0 rgba(0,0,0,.12)}
#stamp.show{animation:stamp 1.6s ease-out forwards}
@keyframes stamp{0%{transform:translateY(-50%) scale(0) rotate(-20deg);opacity:0}
 18%{transform:translateY(-50%) scale(1.25) rotate(6deg);opacity:1}
 30%{transform:translateY(-50%) scale(1) rotate(0)}
 80%{opacity:1}100%{opacity:0;transform:translateY(-60%) scale(1)}}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.colors{display:flex;gap:8px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--edge);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{transform:scale(1.18);box-shadow:0 0 0 3px var(--text)}
.actions{display:flex;gap:8px;flex:1;justify-content:flex-end}
.btn{border:0;border-radius:18px;padding:12px 14px;font:600 18px 'Fredoka',sans-serif;background:var(--btn);color:var(--text);
  box-shadow:0 5px 0 var(--edge);cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn.go{background:var(--grass);color:#fff;box-shadow:0 5px 0 #1E8A50;min-width:120px}
.btn.go.next{background:var(--ocean);box-shadow:0 5px 0 #1B5FB8;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
button:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.lt{flex:0 0 auto;width:58px;height:70px;border:0;border-radius:16px;background:var(--btn);color:var(--text);cursor:pointer;
  box-shadow:0 4px 0 var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;scroll-snap-align:center}
.lt .g{display:flex;height:40px;align-items:center}
.lt .st{font-size:11px;letter-spacing:1px;color:var(--core)}
.lt .st b{color:var(--sun);font-weight:400}
.lt[aria-current="true"]{background:var(--sun);color:#23304A;box-shadow:0 4px 0 #C99612}
.lt[aria-current="true"] .st{color:#23304A88}
.lt[aria-current="true"] .st b{color:#fff}
.jump{animation:jump .7s ease}
@keyframes jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-22px) rotate(-10deg)}60%{transform:translateY(0) rotate(8deg)}}
.shake{animation:shake .45s ease}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
@media (prefers-reduced-motion:reduce){.jump,.shake,.btn.go.next{animation:none}}
@media (max-width:420px){.btn{padding:11px 11px;font-size:16px}.btn.go{min-width:100px}.sw{width:30px;height:30px}h1{font-size:20px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Letrinhas <span class="cur">Mágicas</span></h1>
    <div class="chip" title="Estrelas ganhas">⭐ <span id="total">0</span></div>
    <button id="btnMute" class="icon" aria-label="Som ligado">🔊</button>
  </header>

  <nav class="tabs" aria-label="Tipo de letra">
    <button class="tab" data-set="lower" aria-pressed="true">abc</button>
    <button class="tab" data-set="upper" aria-pressed="false">ABC</button>
    <button class="tab" data-set="num" aria-pressed="false">123</button>
  </nav>

  <div class="coach">
    <div id="mascot" class="mascot" aria-hidden="true">🦉</div>
    <div id="bubble" class="bubble" aria-live="polite">Olá! Começa na bolinha verde e segue as setas ✏️</div>
    <button id="btnSay" class="icon" aria-label="Ouvir o nome da letra">🗣️</button>
  </div>

  <div class="stage-wrap">
    <div id="stage">
      <canvas id="guide"></canvas>
      <canvas id="demo"></canvas>
      <canvas id="ink" aria-label="Área de desenho"></canvas>
      <div id="stamp"></div>
    </div>
  </div>

  <div class="tools">
    <div class="colors" id="colors"></div>
    <div class="actions">
      <button id="btnShow" class="btn">👀 Ver como é</button>
      <button id="btnClear" class="btn">🧽 Apagar</button>
      <button id="btnGo" class="btn go">✅ Pronto!</button>
    </div>
  </div>

  <div id="strip" class="strip" aria-label="Escolher letra"></div>
</div>
<canvas id="fx"></canvas>

function sample(d, step){
  const t = d.match(/[MLC]|-?\d+(?:\.\d+)?/g); let i=0, cmd='', cur=[0,0]; const pts=[];
  const n = () => parseFloat(t[i++]);
  while (i < t.length){

    if (cmd==='M'){ cur=[n(),n()]; pts.push(cur); cmd='L'; }
    else if (cmd==='L'){ const p=[n(),n()], m=Math.max(1,Math.ceil(Math.hypot(p[0]-cur[0],p[1]-cur[1])/step));

let AC=null, master=null;
function ac(){
  if (!AC) { try { AC = new (window.AudioContext||window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination); } catch(e){ return null; } }

  if (o.vib) { const l=a.createOscillator(), lg=a.createGain(); l.frequency.value=o.vibRate||6; lg.gain.value=o.vib; l.connect(lg); lg.connect(osc.frequency); l.start(now); l.stop(now+dur+.05); }
  let node = osc;
  if (o.filter) { const f=a.createBiquadFilter(); f.type=o.filter; f.frequency.value=o.fq||1000; f.Q.value=o.q||1; node.connect(f); node=f; }
  node.connect(g); g.connect(master);
  osc.start(now); osc.stop(now+dur+.05);
}
const WINS = [
  () => { // boing!
    note({f0:90,f1:480,glide:.18,dur:.75,vol:.45,vib:70,vibRate:16});
    note({type:'triangle',f0:180,f1:960,glide:.18,dur:.5,vol:.12,vib:120,vibRate:16});
    return .75; },
  () => { // apito de escorrega
    note({f0:420,f1:1900,glide:.42,dur:.48,vol:.35,vib:25,vibRate:8});
    note({f0:1900,f1:700,glide:.22,at:.48,dur:.26,vol:.3,vib:25,vibRate:8});
    note({f0:700,f1:2300,glide:.2,at:.76,dur:.3,vol:.3,vib:25,vibRate:8});
    return 1.1; },
  () => { // bolinhas de sabão
    for (let i=0;i<7;i++){ const f=320+i*110+Math.random()*60; note({f0:f,f1:f*2.6,glide:.07,at:i*.075,dur:.11,vol:.35}); }
    return .6; },
  () => { // kazoo "ta-da!"
    [523,659,784,1047].forEach((f,i)=>note({type:'sawtooth',f0:f,at:i*.13,dur:i===3?.55:.14,vol:.22,vib:i===3?14:5,vibRate:6,filter:'bandpass',fq:1400,q:2.5}));
    return .95; },
  () => { // quá-quá + fiuuu
    [0,.22].forEach(t=>note({type:'sawtooth',f0:760,f1:420,glide:.14,at:t,dur:.16,vol:.3,filter:'bandpass',fq:1100,q:6}));
    note({f0:300,f1:1400,glide:.3,at:.5,dur:.35,vol:.3,vib:40,vibRate:12});
    return .9; }
];
let lastWin = -1;
function sfxWin(stars){
  let i; do { i = Math.floor(Math.random()*WINS.length); } while (i===lastWin && WINS.length>1);
  lastWin = i;
  const t = WINS[i]();
  [1568,2093,2637].slice(0,stars).forEach((f,k)=>note({type:'triangle',f0:f,at:t+k*.13,dur:.4,vol:.14}));
}
function sfxOops(){ // "uô-uôôô" suave e grave
  note({type:'triangle',f0:330,f1:315,glide:.3,dur:.34,vol:.26,vib:7,vibRate:5,filter:'lowpass',fq:900});
  note({type:'triangle',f0:262,f1:220,glide:.55,at:.36,dur:.72,vol:.26,vib:9,vibRate:5,filter:'lowpass',fq:800});
}
const sfxPop = () => note({f0:520,f1:980,glide:.06,dur:.1,vol:.16});

function speak(text){
  if (S.muted || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const vs = speechSynthesis.getVoices();
    const v = vs.find(v=>/^pt[-_]PT/i.test(v.lang)) || vs.find(v=>/^pt/i.test(v.lang));
    if (v) u.voice = v; u.lang = v ? v.lang : 'pt-PT'; u.rate = .9; u.pitch = 1.2;
    speechSynthesis.speak(u);
  } catch(e) {}
}
function letterName(c){
  if (/\d/.test(c)) return NUMS[+c];
  const n = NAMES[c.toLowerCase()];
  return c === c.toUpperCase() ? n + ' maiúsculo' : n;
}

/* ---------- Tamanhos e desenho da letra ---------- */
function resize(){
  const wrapW = stage.parentElement.clientWidth;
  const W = Math.min(wrapW, 640);
  let H = Math.round(W*.78);
  const maxH = Math.max(230, window.innerHeight*.5);
  if (H > maxH) H = Math.round(maxH);
  S.W = W; S.H = H; S.dpr = Math.min(window.devicePixelRatio||1, 2.5);
  stage.style.width = W+'px'; stage.style.height = H+'px';
  for (const [c,x] of [[guide,gctx],[demoC,dctx],[ink,ictx]]) {
    c.width = Math.round(W*S.dpr); c.height = Math.round(H*S.dpr);
    x.setTransform(S.dpr,0,0,S.dpr,0,0);
  }
  fx.width = Math.round(innerWidth*S.dpr); fx.height = Math.round(innerHeight*S.dpr);
  fctx.setTransform(S.dpr,0,0,S.dpr,0,0);
  if (S.ready) { layout(); drawGuide(); redrawInk(); }
}
function layout(){
  const st = strokesOf(ch()), b = bbox(st);
  const {W,H} = S, u = Math.min(W,H), pad = u*.14;
  const k = Math.min((W-2*pad)/Math.max(1,b.x1-b.x0), (H-2*pad)/Math.max(1,b.y1-b.y0), (H-2*pad)/310*1.9);
  const ox = W/2-(b.x0+b.x1)/2*k, oy = H/2-(b.y0+b.y1)/2*k, track = u*.085;
  S.L = { k, ox, oy, u, px: st.map(p => p.map(([x,y]) => [ox+x*k, oy+y*k])), track, brush:Math.max(9,u*.062), zone:track*2.1 };
}
function polys(c, list, w, col){
  c.save(); c.lineCap='round'; c.lineJoin='round'; c.lineWidth=w; c.strokeStyle=col;
  for (const p of list){ c.beginPath(); c.moveTo(p[0][0],p[0][1]); for (let i=1;i<p.length;i++) c.lineTo(p[i][0],p[i][1]); if (p.length===1) c.lineTo(p[0][0]+.01,p[0][1]); c.stroke(); }
  c.restore();
}
function glyph(c, kind, col){
  const L = S.L;
  polys(c, L.px, kind==='track' ? L.track : kind==='zone' ? L.zone : kind==='demo' ? L.brush*.9 : 3, col);
}
function drawArrows(c){
  const L = S.L, gap = Math.max(38, L.u*.15), sz = Math.max(6, L.track*.34), col = css('--arrow');
  const placed = L.px.map(p => p[0]);
  for (const p of L.px){
    if (p.length < 4) continue;
    let acc = 0, nextAt = gap*.8;
    for (let i=1;i<p.length-3;i++){
      acc += Math.hypot(p[i][0]-p[i-1][0], p[i][1]-p[i-1][1]);
      if (acc < nextAt) continue;
      nextAt += gap;
      if (placed.some(q => Math.hypot(q[0]-p[i][0], q[1]-p[i][1]) < gap*.6)) continue;
      const a = p[Math.max(0,i-3)], b = p[Math.min(p.length-1,i+3)];
      placed.push(p[i]);
      c.save(); c.translate(p[i][0],p[i][1]); c.rotate(Math.atan2(b[1]-a[1], b[0]-a[0]));
      c.fillStyle = col; c.beginPath(); c.moveTo(sz,0); c.lineTo(-sz*.7,-sz*.85); c.lineTo(-sz*.2,0); c.lineTo(-sz*.7,sz*.85); c.closePath(); c.fill();
      c.restore();
    }
  }
  const multi = L.px.length > 1, r = Math.max(10, L.track*.46);
  L.px.forEach((p,i) => {
    const [x,y] = p[0];
    c.save(); c.fillStyle = css('--grass'); c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.stroke();
    if (multi){ c.fillStyle='#fff'; c.font=`700 ${Math.round(r*1.25)}px Fredoka, sans-serif`; c.textAlign='center'; c.textBaseline='middle'; c.fillText(String(i+1), x, y+1); }
    c.restore();
  });
}
function drawGuide(){
  const c = gctx, {W,H} = S, L = S.L;
  c.clearRect(0,0,W,H);
  c.save(); c.lineWidth = 2; c.strokeStyle = css('--rule');
  [-110,0,100,200].forEach((uy,i) => {
    const ly = L.oy + uy*L.k;
    if (ly < 4 || ly > H-4) return;
    c.setLineDash(i===1 ? [8,8] : []); c.globalAlpha = i===2 ? 1 : .7;
    c.beginPath(); c.moveTo(0,ly); c.lineTo(W,ly); c.stroke();
  });
  c.setLineDash([]); c.globalAlpha = 1;
  c.strokeStyle = css('--margin'); c.beginPath(); c.moveTo(W*.07,0); c.lineTo(W*.07,H); c.stroke();
  c.restore();
  glyph(c, 'track', css('--track'));
  glyph(c, 'core', css('--core'));
  drawArrows(c);
}
function paintStroke(c, st, W, H, bw, col){
  const p = st.pts; c.save();
  c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = bw;
  c.strokeStyle = c.fillStyle = col || st.color;
  if (p.length === 1) { c.beginPath(); c.arc(p[0].x*W, p[0].y*H, bw/2, 0, Math.PI*2); c.fill(); }
  else { c.beginPath(); c.moveTo(p[0].x*W, p[0].y*H); for (let i=1;i<p.length;i++) c.lineTo(p[i].x*W, p[i].y*H); c.stroke(); }
  c.restore();
}
function redrawInk(){ ictx.clearRect(0,0,S.W,S.H); for (const st of S.strokes) paintStroke(ictx, st, S.W, S.H, S.L.brush); }

/* ---------- Desenhar com o dedo ---------- */
function pt(e){ const r = ink.getBoundingClientRect(); return { x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height }; }
ink.addEventListener('pointerdown', e => {
  if (!S.ready) return;
  e.preventDefault(); ac();
  if (S.done) { clearInk(); setDone(false); say('Mais uma vez? Força! ✏️'); }
  try { ink.setPointerCapture(e.pointerId); } catch(_) {}
  const p = pt(e);
  S.cur = { color:S.color, pts:[p] }; S.strokes.push(S.cur);
  paintStroke(ictx, {pts:[p]}, S.W, S.H, S.L.brush, S.color);
});
ink.addEventListener('pointermove', e => {
  if (!S.cur) return; e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) {
    const p = pt(ev), pts = S.cur.pts, q = pts[pts.length-1];
    pts.push(p);
    ictx.save(); ictx.lineCap='round'; ictx.lineWidth=S.L.brush; ictx.strokeStyle=S.cur.color;
    ictx.beginPath(); ictx.moveTo(q.x*S.W, q.y*S.H); ictx.lineTo(p.x*S.W, p.y*S.H); ictx.stroke(); ictx.restore();
  }
});
const endStroke = () => { S.cur = null; };
ink.addEventListener('pointerup', endStroke);
ink.addEventListener('pointercancel', endStroke);
ink.addEventListener('lostpointercapture', endStroke);

function clearInk(){ S.strokes = []; S.cur = null; ictx.clearRect(0,0,S.W,S.H); }

/* ---------- Avaliação ---------- */
function evaluate(){
  const {W,H} = S, ew = 260, eh = Math.round(ew*H/W), s = ew/W;
  const mk = () => { const c=document.createElement('canvas'); c.width=ew; c.height=eh; const x=c.getContext('2d',{willReadFrequently:true}); x.setTransform(s,0,0,s,0,0); return x; };
  const cx = mk(), zx = mk(), ux = mk();
  polys(cx, S.L.px, 2.5/s, '#000'); glyph(zx,'zone','#000');
  for (const st of S.strokes) paintStroke(ux, st, W, H, S.L.brush, '#000');
  const a = x => x.getImageData(0,0,ew,eh).data;
  const cd=a(cx), zd=a(zx), ud=a(ux);
  let core=0, cov=0, user=0, inZone=0;
  for (let i=3;i<cd.length;i+=4){
    const c = cd[i]>100, z = zd[i]>60, u = ud[i]>100;
    if (c) { core++; if (u) cov++; }
    if (u) { user++; if (z) inZone++; }
  }
  return { cov: core ? cov/core : 0, prec: user ? inZone/user : 0 };
}
function check(){
  if (S.done) { next(); return; }
  ac();
  if (!S.strokes.length) { say('Primeiro desenha a letra com o dedo ✏️'); bump(mascot,'shake'); return; }
  const r = evaluate();
  if (r.cov >= .75 && r.prec >= .68) {
    const stars = (r.cov>=.92 && r.prec>=.86) ? 3 : (r.cov>=.85 && r.prec>=.78) ? 2 : 1;
    win(stars);
  } else lose(r);
}
function win(stars){
  sfxWin(stars); confetti(stars);
  stamp.textContent = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
  stamp.classList.remove('show'); void stamp.offsetWidth; stamp.classList.add('show');
  mascot.textContent = '🥳'; bump(mascot,'jump');
  setTimeout(()=>{ mascot.textContent='🦉'; }, 1800);
  const k = ch(), prev = store.stars[k]||0;
  if (stars > prev) { store.stars[k] = stars; save(); }
  say(stars===3 ? WIN_MSG[Math.floor(Math.random()*WIN_MSG.length)] : stars===2 ? 'Muito bem! Consegues 3 estrelas? ⭐' : 'Boa! Com mais calma ainda fica melhor 🙂');
  updateTotal(); buildStrip(); setDone(true);
}
function lose(r){
  sfxOops(); bump(stage,'shake');
  mascot.textContent = '🙈'; setTimeout(()=>{ mascot.textContent='🦉'; }, 1500);
  if (r.cov < .3) say('Desenha por cima da letra toda, devagarinho 🐢');
  else if (r.prec < .68) say('Quase! Tenta ficar dentro do caminho cinzento 🛤️');
  else say('Quase! Falta um bocadinho da letra 😉');
}
function setDone(v){
  S.done = v;
  btnGo.textContent = v ? 'Próxima ➡️' : '✅ Pronto!';
  btnGo.classList.toggle('next', v);
}
function next(){
  const n = letters().length;
  if (S.idx === n-1) { say('Fizeste todas! És um campeão das letras! 🏆'); confetti(3); }
  select((S.idx+1) % n);
}

/* ---------- Mostrar como se faz ---------- */
function demo(){
  if (S.demoing || !S.ready) return;
  S.demoing = true; sfxPop(); clearInk(); setDone(false);
  const L = S.L, col = css('--grape');
  const lens = L.px.map(p => { let s=0; for (let i=1;i<p.length;i++) s += Math.hypot(p[i][0]-p[i-1][0], p[i][1]-p[i-1][1]); return s; });
  const pause = L.u*.3, speed = L.u*.7;
  const total = lens.reduce((a,b) => a+b+pause, 0), t0 = performance.now();
  const step = t => {
    const done = (t-t0)/1000*speed; let d = done, tip = null;
    dctx.clearRect(0,0,S.W,S.H);
    dctx.save(); dctx.globalAlpha=.6; dctx.lineCap='round'; dctx.lineJoin='round'; dctx.lineWidth=L.brush*.9; dctx.strokeStyle=col;
    for (let s=0; s<L.px.length && d>0; s++){
      const p = L.px[s]; let acc = 0; tip = p[0];
      dctx.beginPath(); dctx.moveTo(p[0][0],p[0][1]);
      if (p.length===1) dctx.lineTo(p[0][0]+.01,p[0][1]);
      for (let i=1;i<p.length;i++){
        const seg = Math.hypot(p[i][0]-p[i-1][0], p[i][1]-p[i-1][1]);
        if (acc+seg > d){ const f=(d-acc)/seg; tip=[p[i-1][0]+(p[i][0]-p[i-1][0])*f, p[i-1][1]+(p[i][1]-p[i-1][1])*f]; dctx.lineTo(tip[0],tip[1]); break; }
        acc += seg; tip = p[i]; dctx.lineTo(p[i][0],p[i][1]);
      }
      dctx.stroke(); d -= lens[s] + pause;
    }
    dctx.restore();
    if (tip){ dctx.font='30px serif'; dctx.textBaseline='bottom'; dctx.fillText('✏️', tip[0]-3, tip[1]+3); }
    if (done < total) requestAnimationFrame(step);
    else setTimeout(() => { dctx.clearRect(0,0,S.W,S.H); S.demoing = false; }, 700);
  };
  requestAnimationFrame(step);
  say('Olha como se faz! Agora tu ✨');
}

/* ---------- Confetti ---------- */
let parts = [], fxOn = false;
function confetti(stars){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = stage.getBoundingClientRect(), cx = r.left+r.width/2, cy = r.top+r.height/2;
  const cols = ['#FF5A5F','#FFC83D','#2FBF71','#8B5CF6','#2F80ED','#FF9F1C'];
  const n = 40 + stars*30;
  for (let i=0;i<n;i++) parts.push({ x:cx, y:cy, vx:(Math.random()-.5)*16, vy:-Math.random()*15-4,
    r:Math.random()*6, vr:(Math.random()-.5)*.4, s:6+Math.random()*8, c:cols[i%cols.length], star:Math.random()<.2 });
  if (!fxOn) { fxOn = true; requestAnimationFrame(loop); }
}
function loop(){
  const w = innerWidth, h = innerHeight;
  fctx.clearRect(0,0,w,h);
  for (const p of parts){
    p.vy += .42; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    fctx.save(); fctx.translate(p.x,p.y); fctx.rotate(p.r);
    if (p.star) { fctx.font = `${p.s*2}px serif`; fctx.fillText('⭐', -p.s, p.s); }
    else { fctx.fillStyle = p.c; fctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); }
    fctx.restore();
  }
  parts = parts.filter(p => p.y < h+60);
  if (parts.length) requestAnimationFrame(loop); else { fxOn = false; fctx.clearRect(0,0,w,h); }
}

/* ---------- UI ---------- */
function say(t){ bubble.textContent = t; }
function bump(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function updateTotal(){ $('total').textContent = Object.values(store.stars).reduce((a,b)=>a+b,0); }
function miniSVG(c){
  const st = strokesOf(c), b = bbox(st), pad = 14;
  const d = st.map(p => 'M' + p.filter((_,i)=>i%3===0||i===p.length-1).map(q => q[0].toFixed(0)+' '+q[1].toFixed(0)).join('L') + (p.length===1?'l0.1 0':'')).join(' ');
  return `<svg viewBox="${b.x0-pad} ${b.y0-pad} ${b.x1-b.x0+2*pad} ${b.y1-b.y0+2*pad}" width="40" height="40" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="2.6" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function buildStrip(){
  const strip = $('strip'); strip.innerHTML = '';
  [...letters()].forEach((c,i) => {
    const b = document.createElement('button'); b.className = 'lt';
    b.setAttribute('aria-label', 'Letra ' + letterName(c));
    if (i === S.idx) b.setAttribute('aria-current','true');
    const n = store.stars[c]||0;
    b.innerHTML = `<span class="g"></span><span class="st">${'<b>★</b>'.repeat(n)}${'★'.repeat(3-n)}</span>`;
    b.querySelector('.g').innerHTML = miniSVG(c);
    b.onclick = () => { ac(); select(i); };
    strip.appendChild(b);
  });
  const act = strip.querySelector('[aria-current="true"]');
  if (act) act.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
}
function select(i){
  S.idx = i; clearInk(); setDone(false);
  dctx.clearRect(0,0,S.W,S.H);
  layout(); drawGuide(); buildStrip(); sfxPop();
  setTimeout(() => speak(letterName(ch())), 150);
  const n = store.stars[ch()]||0;
  say(n===3 ? 'Já tens 3 estrelas nesta! Faz outra vez 😎' : 'Começa na bolinha verde e segue as setas ✏️');
}
function buildColors(){
  const box = $('colors');
  CRAYONS.forEach((c,i) => {
    const b = document.createElement('button'); b.className='sw'; b.style.background=c;
    b.setAttribute('aria-label','Cor '+(i+1)); b.setAttribute('aria-pressed', i===0 ? 'true':'false');
    b.onclick = () => { S.color=c; box.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false')); sfxPop(); };
    box.appendChild(b);
  });
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  ac();
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-pressed', x===t ? 'true':'false'));
  S.set = t.dataset.set; S.idx = 0; select(0);
});
$('btnClear').onclick = () => { clearInk(); setDone(false); sfxPop(); say('Tudo limpinho! Outra vez ✏️'); };
$('btnShow').onclick = demo;
btnGo.onclick = check;
$('btnSay').onclick = () => { ac(); speak(letterName(ch())); };
function setMute(v){ S.muted = v; store.muted = v; save(); const b=$('btnMute'); b.textContent = v?'🔇':'🔊'; b.setAttribute('aria-label', v?'Som desligado':'Som ligado'); }
$('btnMute').onclick = () => { setMute(!S.muted); if (!S.muted) sfxPop(); };
setMute(S.muted);

matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => S.ready && drawGuide());
new MutationObserver(() => S.ready && drawGuide()).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 120); });

function init(){
  buildColors();
  S.ready = true; resize(); updateTotal(); buildStrip(); layout(); drawGuide();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawGuide());
}
init();
})();
</script>
