<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Porta Assombrada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Rubik:wght@400;600&display=swap">
<style>
/* Layout: um único ecrã, porta ao centro, botão grande por baixo */
:root{
  --bg:#120d16; --panel:#1e1624; --wood:#5a3a22; --wood-dark:#3a2414;
  --fg:#efe6d8; --muted:#a4949c; --pumpkin:#ff7a1a; --ghost:#8cf2c8;
  --display:'Creepster',Impact,fantasy; --body:'Rubik',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 20%,#2a1a33 0%,var(--bg) 70%);color:var(--fg);font-family:var(--body);
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,11vw,3.6rem);margin:0;color:var(--pumpkin);letter-spacing:.04em;text-shadow:0 0 18px rgba(255,122,26,.45)}
.frame{width:150px;height:230px;background:#000;border:8px solid var(--wood-dark);border-bottom:none;border-radius:6px 6px 0 0;perspective:500px;box-shadow:0 0 40px rgba(140,242,200,.08)}
.door{width:100%;height:100%;background:repeating-linear-gradient(90deg,var(--wood) 0 22px,var(--wood-dark) 22px 24px);transform-origin:left center;transition:transform .12s linear;position:relative}
.door::after{content:"";position:absolute;right:14px;top:50%;width:12px;height:12px;border-radius:50%;background:#c9a24a}
.frame.armed{box-shadow:0 0 50px rgba(140,242,200,.35)}
#toggle{font-family:var(--body);font-weight:600;font-size:1.25rem;width:min(320px,100%);padding:20px;border-radius:999px;border:3px solid var(--pumpkin);background:transparent;color:var(--pumpkin);cursor:pointer}
#toggle.on{background:var(--pumpkin);color:var(--bg)}
#toggle:focus-visible,button:focus-visible{outline:3px solid var(--ghost);outline-offset:3px}
.status{color:var(--muted);min-height:2.6em;max-width:32ch;line-height:1.35}
.status b{color:var(--ghost)}
.controls{display:flex;flex-direction:column;gap:12px;width:min(320px,100%)}
label{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--pumpkin)}
.small{background:var(--panel);color:var(--fg);border:1px solid #3a2e40;border-radius:10px;padding:12px;font:inherit;cursor:pointer}
.meter{position:relative;height:10px;border-radius:99px;background:var(--panel);border:1px solid #3a2e40;overflow:hidden}
.meter span{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--ghost),var(--pumpkin));transition:width .1s linear}
.meter i{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--fg);opacity:.7}
.pick{justify-content:center;color:var(--fg);font-size:1rem}
.hint{font-size:.75rem;color:var(--muted);margin:-4px 0 0;text-align:left}
@media (prefers-reduced-motion:reduce){.door,.door.open{transition:none}}
</style>
</head>
<body>
<h1>Porta Assombrada</h1>
<div class="frame" id="frame"><div class="door" id="door"></div></div>
<button id="toggle" type="button">Ativar</button>
<p class="status" id="status">Carrega em <b>Ativar</b>, e abre a porta devagar: o rangido acompanha o movimento…</p>
<div class="controls">
  <label for="sens"><span>Sensibilidade</span><span id="sensVal">Média</span></label>
  <input id="sens" type="range" min="1" max="5" value="3">
  <div class="meter" aria-hidden="true"><span id="bar"></span><i></i></div>
  <p class="hint">A barra mostra o movimento. Quando passa a linha branca, a porta range.</p>
  <button class="small" id="test" type="button">Testar o som</button>
  <label class="small pick" for="ownSound">Usar um som meu (MP3, WAV…)</label>
  <input id="ownSound" type="file" accept="audio/*" hidden>
  <button class="small" id="resetSound" type="button" hidden>Voltar ao rangido da app</button>
</div>

<script>
const $=id=>document.getElementById(id);
let armed=false, armedAt=0, wakeLock=null, gotMotion=false;
let level=0, prevAcc=null, doorAngle=0;
const names={1:'Muito baixa',2:'Baixa',3:'Média',4:'Alta',5:'Muito alta'};
// limiares para uma porta a abrir devagar: rotação em graus/segundo (giroscópio)
const rotThr={1:60,2:40,3:25,4:15,5:8};
const accThr={1:5,2:3.5,3:2.2,4:1.4,5:0.8};
const sens=()=>$('sens').value;
try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}

/* ---------- Motor de rangido em tempo real ----------
   A dobradiça "agarra e solta": cada soltura é um pequeno estalo.
   Porta devagar = poucos estalos por segundo (rangido arrastado);
   mais depressa = mais estalos; parada = silêncio. */
const workletCode=`
class Creak extends AudioWorkletProcessor{
  static get parameterDescriptors(){return [{name:'speed',defaultValue:0,minValue:0,maxValue:4,automationRate:'k-rate'}];}
  constructor(){super();this.amp=0;this.next=0;this.pulse=0;this.k=0;this.t=0;}
  process(inputs,outputs,params){
    const out=outputs[0][0], sp=params.speed[0];
    const target=Math.max(0,Math.min(1,(sp-0.6)/0.9));
    for(let n=0;n<out.length;n++){
      this.amp+=(target-this.amp)*(target>this.amp?0.002:0.0006);
      this.t++;
      if(this.next<=0){
        let f=(9+38*Math.min(sp,2.5))*(0.7+Math.random()*0.6)+5*Math.sin(this.t/sampleRate*2.3);
        this.next=sampleRate/Math.max(5,f);
        this.pulse=this.amp*(0.55+0.45*Math.random());
        this.k=0;
      }
      this.next--;
      out[n]=this.pulse*(Math.random()*2-1)*Math.exp(-this.k/(sampleRate*0.0012));
      this.k++;
    }
    return true;
  }
}
registerProcessor('creak',Creak);`;

let ctx=null, speedParam=null, engineReady=false;

function makeRoom(c,secs){
  const sr=c.sampleRate, n=Math.floor(sr*secs), b=c.createBuffer(1,n,sr), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  return b;
}

// cadeia de som: estalos -> ressonâncias da madeira -> um pouco de eco
function buildChain(c,source){
  const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=90;
  const mix=c.createGain();
  [[380,9,1],[820,12,0.8],[1650,14,0.6],[2900,10,0.3]].forEach(([fr,q,g])=>{
    const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=fr*(0.92+Math.random()*0.16); bp.Q.value=q;
    const gn=c.createGain(); gn.gain.value=g;
    hp.connect(bp); bp.connect(gn); gn.connect(mix);
  });
  const dry=c.createGain(); dry.gain.value=0.05; hp.connect(dry); dry.connect(mix);
  source.connect(hp);
  const room=c.createConvolver(); room.buffer=makeRoom(c,0.9);
  const wet=c.createGain(); wet.gain.value=0.12;
  mix.connect(room); room.connect(wet);
  return [mix,wet];
}

async function startEngine(){
  if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)(); }
  try{ await ctx.resume(); }catch(e){}
  if(engineReady||!ctx.audioWorklet) return engineReady;
  try{
    const url=URL.createObjectURL(new Blob([workletCode],{type:'application/javascript'}));
    await ctx.audioWorklet.addModule(url);
    const node=new AudioWorkletNode(ctx,'creak');
    speedParam=node.parameters.get('speed');
    const master=ctx.createGain(); master.gain.value=5;
    const comp=ctx.createDynamicsCompressor();
    buildChain(ctx,node).forEach(n=>n.connect(master));
    master.connect(comp); comp.connect(ctx.destination);
    engineReady=true;
  }catch(e){ engineReady=false; }
  return engineReady;
}

function setSpeed(v){ if(speedParam) speedParam.setTargetAtTime(v,ctx.currentTime,0.06); }

/* ---------- Som próprio do utilizador (opcional) ---------- */
const player=new Audio(); player.preload='auto'; player.setAttribute('playsinline','');
let ownUrl=null, ownPlaying=false;
try{ ownUrl=localStorage.getItem('porta-som'); }catch(e){}
function showOwn(){ $('resetSound').hidden=!ownUrl; }
$('ownSound').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ ownUrl=r.result; try{ localStorage.setItem('porta-som',ownUrl); }catch(err){} showOwn(); $('status').innerHTML='Som novo carregado. Toca em <b>Testar o som</b>.'; };
  r.readAsDataURL(f);
});
$('resetSound').addEventListener('click',()=>{ ownUrl=null; player.pause(); try{ localStorage.removeItem('porta-som'); }catch(e){} showOwn(); $('status').textContent='De volta ao rangido da app.'; });
showOwn();
function unlockOwn(){
  if(!ownUrl) return;
  player.src=ownUrl; player.muted=true;
  const p=player.play(); if(p) p.then(()=>{ player.pause(); player.currentTime=0; player.muted=false; }).catch(()=>{ player.muted=false; });
}
function playOwn(){
  if(ownPlaying||!ownUrl) return;
  ownPlaying=true; player.muted=false; player.src=ownUrl;
  const p=player.play(); if(p) p.catch(()=>{ ownPlaying=false; });
}
player.addEventListener('ended',()=>{ ownPlaying=false; });

/* ---------- Porta no ecrã acompanha o movimento ---------- */
function drawDoor(){ $('door').style.transform='rotateY(-'+doorAngle.toFixed(1)+'deg)'; }
setInterval(()=>{ if(level<0.8&&doorAngle>0){ doorAngle=Math.max(0,doorAngle-0.6); drawDoor(); } },50);

/* ---------- Sensor ---------- */
function onMotion(e){
  gotMotion=true;
  if(!armed) return;
  let score=0;
  const r=e.rotationRate;
  if(r&&(r.alpha!=null||r.beta!=null||r.gamma!=null)){
    score=Math.hypot(r.alpha||0,r.beta||0,r.gamma||0)/rotThr[sens()];
  }
  const a=e.accelerationIncludingGravity||e.acceleration;
  if(a&&a.x!=null){
    if(prevAcc) score=Math.max(score,(Math.abs(a.x-prevAcc.x)+Math.abs(a.y-prevAcc.y)+Math.abs(a.z-prevAcc.z))/accThr[sens()]);
    prevAcc={x:a.x,y:a.y,z:a.z};
  }
  level=level*0.8+score*0.2;
  $('bar').style.width=Math.min(100,level*50)+'%';
  if(Date.now()<armedAt){ setSpeed(0); return; }   // tempo para pousares o telemóvel
  if(ownUrl){ if(level>1) playOwn(); }
  else setSpeed(level);
  if(level>1){
    doorAngle=Math.min(75,doorAngle+level*0.5); drawDoor();
    $('status').innerHTML='<b>Iiiiiiiic…</b>';
  } else if(armed&&level<0.5){ setArmedText(); }
}

function setArmedText(){ $('status').innerHTML='<b>Ativo.</b> Abre a porta devagar e ouve-a ranger.'; }

async function arm(){
  unlockOwn();
  const ok=await startEngine();
  if(!ok&&!ownUrl){ $('status').textContent='Este browser não consegue gerar o rangido. Experimenta o Chrome ou o Safari atualizados, ou escolhe um som teu.'; }
  if(typeof DeviceMotionEvent==='undefined'){
    $('status').textContent='Este dispositivo não tem sensor de movimento.'; return;
  }
  if(typeof DeviceMotionEvent.requestPermission==='function'){ // iPhone
    try{ const r=await DeviceMotionEvent.requestPermission(); if(r!=='granted'){ $('status').textContent='Sem permissão para o sensor de movimento.'; return; } }
    catch(err){ $('status').textContent='Não foi possível pedir acesso ao sensor.'; return; }
  }
  window.addEventListener('devicemotion',onMotion);
  try{ wakeLock=await navigator.wakeLock?.request('screen'); }catch(e){}
  prevAcc=null; level=0; armed=true; armedAt=Date.now()+2500;
  $('toggle').textContent='Desativar'; $('toggle').classList.add('on'); $('frame').classList.add('armed');
  setArmedText();
  gotMotion=false;
  setTimeout(()=>{ if(armed&&!gotMotion) $('status').innerHTML='O sensor de movimento não está a responder nesta página. Abre a app a partir de um site com <b>https</b> (por exemplo GitHub Pages).'; },3000);
}

function disarm(){
  armed=false; window.removeEventListener('devicemotion',onMotion);
  setSpeed(0); player.pause(); ownPlaying=false;
  try{ wakeLock?.release(); }catch(e){} wakeLock=null;
  level=0; $('bar').style.width='0';
  $('toggle').textContent='Ativar'; $('toggle').classList.remove('on'); $('frame').classList.remove('armed');
  $('status').innerHTML='Desativado. Carrega em <b>Ativar</b> para voltar a assombrar.';
}

// teste: simula uma porta a abrir devagar durante 3 segundos
async function testSound(){
  if(ownUrl){ unlockOwn(); setTimeout(playOwn,50); return; }
  if(!(await startEngine())){ $('status').textContent='Este browser não consegue gerar o rangido.'; return; }
  const t=ctx.currentTime;
  speedParam.cancelScheduledValues(t);
  speedParam.setValueAtTime(0,t);
  speedParam.linearRampToValueAtTime(1.3,t+0.6);
  speedParam.linearRampToValueAtTime(1.8,t+2.0);
  speedParam.linearRampToValueAtTime(1.1,t+2.8);
  speedParam.linearRampToValueAtTime(0,t+3.2);
  let k=0; const iv=setInterval(()=>{ doorAngle=Math.min(75,doorAngle+1.2); drawDoor(); if(++k>=55) clearInterval(iv); },50);
  setTimeout(()=>{ doorAngle=0; drawDoor(); },4500);
}

$('toggle').addEventListener('click',()=>armed?disarm():arm());
$('test').addEventListener('click',testSound);
$('sens').addEventListener('input',e=>$('sensVal').textContent=names[e.target.value]);
document.addEventListener('visibilitychange',async()=>{ if(armed&&document.visibilityState==='visible'){ try{ wakeLock=await navigator.wakeLock?.request('screen'); await ctx?.resume(); }catch(e){} } });
</script>
</body>
</html>
