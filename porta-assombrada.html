<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Porta Assombrada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Rubik:wght@400;600&display=swap">
<style>
/* Layout: um único ecrã, porta ao centro, botão grande por baixo */
:root{
  --bg:#120d16; --panel:#1e1624; --wood:#5a3a22; --wood-dark:#3a2414;
  --fg:#efe6d8; --muted:#a4949c; --pumpkin:#ff7a1a; --ghost:#8cf2c8;
  --display:'Creepster',Impact,fantasy; --body:'Rubik',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 20%,#2a1a33 0%,var(--bg) 70%);color:var(--fg);font-family:var(--body);
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,11vw,3.6rem);margin:0;color:var(--pumpkin);letter-spacing:.04em;text-shadow:0 0 18px rgba(255,122,26,.45)}
.frame{width:150px;height:230px;background:#000;border:8px solid var(--wood-dark);border-bottom:none;border-radius:6px 6px 0 0;perspective:500px;box-shadow:0 0 40px rgba(140,242,200,.08)}
.door{width:100%;height:100%;background:repeating-linear-gradient(90deg,var(--wood) 0 22px,var(--wood-dark) 22px 24px);transform-origin:left center;transition:transform .4s ease;position:relative}
.door::after{content:"";position:absolute;right:14px;top:50%;width:12px;height:12px;border-radius:50%;background:#c9a24a}
.door.open{transform:rotateY(-55deg);transition:transform 1.4s cubic-bezier(.3,.1,.2,1)}
.frame.armed{box-shadow:0 0 50px rgba(140,242,200,.35)}
#toggle{font-family:var(--body);font-weight:600;font-size:1.25rem;width:min(320px,100%);padding:20px;border-radius:999px;border:3px solid var(--pumpkin);background:transparent;color:var(--pumpkin);cursor:pointer}
#toggle.on{background:var(--pumpkin);color:var(--bg)}
#toggle:focus-visible,button:focus-visible{outline:3px solid var(--ghost);outline-offset:3px}
.status{color:var(--muted);min-height:2.6em;max-width:32ch;line-height:1.35}
.status b{color:var(--ghost)}
.controls{display:flex;flex-direction:column;gap:12px;width:min(320px,100%)}
label{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--pumpkin)}
.small{background:var(--panel);color:var(--fg);border:1px solid #3a2e40;border-radius:10px;padding:12px;font:inherit;cursor:pointer}
.meter{position:relative;height:10px;border-radius:99px;background:var(--panel);border:1px solid #3a2e40;overflow:hidden}
.meter span{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--ghost),var(--pumpkin));transition:width .1s linear}
.meter i{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--fg);opacity:.7}
.hint{font-size:.75rem;color:var(--muted);margin:-4px 0 0;text-align:left}
@media (prefers-reduced-motion:reduce){.door,.door.open{transition:none}}
</style>
</head>
<body>
<h1>Porta Assombrada</h1>
<div class="frame" id="frame"><div class="door" id="door"></div></div>
<button id="toggle" type="button">Ativar</button>
<p class="status" id="status">Carrega em <b>Ativar</b>, e quando o telemóvel rodar, a porta range…</p>
<div class="controls">
  <label for="sens"><span>Sensibilidade</span><span id="sensVal">Média</span></label>
  <input id="sens" type="range" min="1" max="5" value="3">
  <div class="meter" aria-hidden="true"><span id="bar"></span><i></i></div>
  <p class="hint">A barra mostra o movimento. Quando passa a linha branca, a porta range.</p>
  <button class="small" id="test" type="button">Testar o som</button>
</div>

<script>
const $=id=>document.getElementById(id);
let armed=false, armedAt=0, wakeLock=null, gotMotion=false;
let level=0, playing=false, prevAcc=null;
const names={1:'Muito baixa',2:'Baixa',3:'Média',4:'Alta',5:'Muito alta'};
// limiares: rotação em graus/segundo (giroscópio) e variação de aceleração (reserva)
const rotThr={1:140,2:90,3:55,4:32,5:16};
const accThr={1:6,2:4,3:2.6,4:1.6,5:0.9};
const sens=()=>$('sens').value;

// ruído suave (pontos aleatórios com interpolação) para variar tom e intensidade
function smoothNoise(points){
  const p=Array.from({length:points+1},()=>Math.random());
  return x=>{ const t=Math.min(.9999,Math.max(0,x))*points, i=Math.floor(t), f=(1-Math.cos((t-i)*Math.PI))/2; return p[i]*(1-f)+p[i+1]*f; };
}

// Rangido de dobradiça: atrito "agarra-solta" a centenas de vezes por segundo cria um chiar com tom
function makeCreak(sr,dur){
  const n=Math.floor(sr*dur), d=new Float32Array(n);
  const pitch=smoothNoise(10), wob=smoothNoise(35), env=smoothNoise(14), gaps=smoothNoise(22);
  const base=150+Math.random()*120, span=220+Math.random()*260;
  let t=0;
  while(t<n){
    const x=t/n;
    const ramp=Math.min(1,x*3.5);                    // começa num "trrrr" grave e sobe para o chiar
    let f=40+(base-40)*ramp+span*ramp*pitch(x)+40*(wob(x)-.5);
    f*=0.96+0.08*Math.random();                      // irregularidade do atrito
    let a=Math.pow(Math.sin(Math.PI*Math.min(1,x*1.08)),0.5)*(0.35+0.65*env(x));
    if(gaps(x)<0.2) a*=0.12;                         // pequenas falhas no rangido
    a*=0.75+0.5*Math.random();
    const len=Math.floor(sr*0.003);
    for(let i=0;i<len&&t+i<n;i++){
      d[t+i]+=a*(Math.exp(-i/(sr*0.00025))+0.35*(Math.random()*2-1)*Math.exp(-i/(sr*0.0012)));
    }
    t+=Math.max(1,Math.round(sr/f));
  }
  return d;
}

// eco de casa velha: resposta de sala gerada com ruído a decair
function makeRoom(oc,secs){
  const sr=oc.sampleRate, n=Math.floor(sr*secs), b=oc.createBuffer(1,n,sr), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  return b;
}

const creakUrls=[]; let creakIdx=0;
const player=new Audio(); player.preload='auto'; player.setAttribute('playsinline','');
player.preservesPitch=false; player.mozPreservesPitch=false; player.webkitPreservesPitch=false;
try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}

function toWav(buf){
  const d=buf.getChannelData(0), sr=buf.sampleRate, n=d.length;
  let peak=0; for(let i=0;i<n;i++) peak=Math.max(peak,Math.abs(d[i]));
  const k=peak>0?0.97/peak:1;
  const ab=new ArrayBuffer(44+n*2), v=new DataView(ab);
  const s=(o,str)=>{for(let i=0;i<str.length;i++) v.setUint8(o+i,str.charCodeAt(i));};
  s(0,'RIFF'); v.setUint32(4,36+n*2,true); s(8,'WAVE'); s(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  s(36,'data'); v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){ const x=Math.max(-1,Math.min(1,d[i]*k)); v.setInt16(44+i*2,x*32767,true); }
  return URL.createObjectURL(new Blob([ab],{type:'audio/wav'}));
}

async function renderCreak(){
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const sr=44100, dur=2.4, oc=new OAC(1,Math.floor(sr*(dur+0.9)),sr);
  const data=makeCreak(sr,dur), buf=oc.createBuffer(1,data.length,sr);
  buf.getChannelData(0).set(data);
  const src=oc.createBufferSource(); src.buffer=buf;
  const hp=oc.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=140;
  const mix=oc.createGain(); mix.gain.value=1;
  // ressonâncias da madeira e da dobradiça de metal
  [[620,7,1],[1250,9,0.9],[2300,11,0.7],[3700,12,0.45],[5200,10,0.2]].forEach(([fr,q,g])=>{
    const bp=oc.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=fr*(0.88+Math.random()*0.24); bp.Q.value=q;
    const gn=oc.createGain(); gn.gain.value=g;
    hp.connect(bp); bp.connect(gn); gn.connect(mix);
  });
  const dry=oc.createGain(); dry.gain.value=0.15; hp.connect(dry); dry.connect(mix);
  src.connect(hp);
  const room=oc.createConvolver(); room.buffer=makeRoom(oc,0.9);
  const wet=oc.createGain(); wet.gain.value=0.22;
  mix.connect(oc.destination); mix.connect(room); room.connect(wet); wet.connect(oc.destination);
  src.start();
  return toWav(await oc.startRendering());
}

(async()=>{ try{ for(let i=0;i<6;i++) creakUrls.push(await renderCreak()); player.src=creakUrls[0]; }catch(e){ $('status').textContent='Não foi possível criar o som neste browser.'; } })();

// Tem de ser chamado dentro de um toque: desbloqueia o áudio para mais tarde
function unlockAudio(){
  if(!player.src) return;
  player.muted=true;
  const p=player.play();
  if(p) p.then(()=>{ player.pause(); player.currentTime=0; player.muted=false; }).catch(()=>{ player.muted=false; });
}

function nextClip(){
  player.muted=false;
  player.src=creakUrls[creakIdx++ % creakUrls.length]; // cada rangido é um pouco diferente
  player.playbackRate=rateFor(level);
  const p=player.play(); if(p) p.catch(()=>{ playing=false; $('status').innerHTML='O browser bloqueou o som. Toca em <b>Testar o som</b> uma vez e volta a tentar.'; });
}
const rateFor=l=>Math.min(1.35,Math.max(0.85,0.85+(l-1)*0.2));

function startCreak(){
  if(playing||!creakUrls.length) return;
  playing=true; nextClip();
  $('door').classList.add('open');
  if(navigator.vibrate) navigator.vibrate(60);
  if(armed) $('status').innerHTML='<b>Iiiiiiiic…</b> Apanhado!';
}

// quando um rangido acaba: se o telemóvel ainda está a rodar, continua a ranger
player.addEventListener('ended',()=>{
  if(armed&&level>0.6){ nextClip(); return; }
  playing=false; $('door').classList.remove('open');
  if(armed) setTimeout(()=>{ if(armed&&!playing) setArmedText(); },800);
});

function onMotion(e){
  gotMotion=true;
  if(!armed) return;
  let score=0;
  const r=e.rotationRate;
  if(r&&(r.alpha!=null||r.beta!=null||r.gamma!=null)){
    score=Math.hypot(r.alpha||0,r.beta||0,r.gamma||0)/rotThr[sens()];
  }
  const a=e.accelerationIncludingGravity||e.acceleration;
  if(a&&a.x!=null){
    if(prevAcc) score=Math.max(score,(Math.abs(a.x-prevAcc.x)+Math.abs(a.y-prevAcc.y)+Math.abs(a.z-prevAcc.z))/accThr[sens()]);
    prevAcc={x:a.x,y:a.y,z:a.z};
  }
  level=level*0.75+score*0.25;
  $('bar').style.width=Math.min(100,level*50)+'%';
  if(Date.now()<armedAt) return;          // tempo para pousares o telemóvel
  if(level>1) startCreak();
  if(playing) player.playbackRate=rateFor(level); // roda mais depressa, range mais agudo
}

function setArmedText(){ $('status').innerHTML='<b>Ativo.</b> Quando o telemóvel rodar, a porta range.'; }

async function arm(){
  unlockAudio();
  if(typeof DeviceMotionEvent==='undefined'){
    $('status').textContent='Este dispositivo não tem sensor de movimento.'; return;
  }
  if(typeof DeviceMotionEvent.requestPermission==='function'){ // iPhone
    try{ const r=await DeviceMotionEvent.requestPermission(); if(r!=='granted'){ $('status').textContent='Sem permissão para o sensor de movimento.'; return; } }
    catch(err){ $('status').textContent='Não foi possível pedir acesso ao sensor.'; return; }
  }
  window.addEventListener('devicemotion',onMotion);
  try{ wakeLock=await navigator.wakeLock?.request('screen'); }catch(e){}
  prevAcc=null; level=0; armed=true; armedAt=Date.now()+2500;
  $('toggle').textContent='Desativar'; $('toggle').classList.add('on'); $('frame').classList.add('armed');
  setArmedText();
  gotMotion=false;
  setTimeout(()=>{ if(armed&&!gotMotion) $('status').innerHTML='O sensor de movimento não está a responder nesta página. Abre a app a partir de um site com <b>https</b> (por exemplo GitHub Pages).'; },3000);
}

function disarm(){
  armed=false; window.removeEventListener('devicemotion',onMotion);
  try{ wakeLock?.release(); }catch(e){} wakeLock=null;
  level=0; $('bar').style.width='0';
  $('toggle').textContent='Ativar'; $('toggle').classList.remove('on'); $('frame').classList.remove('armed');
  $('status').innerHTML='Desativado. Carrega em <b>Ativar</b> para voltar a assombrar.';
}

$('toggle').addEventListener('click',()=>armed?disarm():arm());
$('test').addEventListener('click',()=>{ if(!playing){ level=1.5; startCreak(); level=0; } });
$('sens').addEventListener('input',e=>$('sensVal').textContent=names[e.target.value]);
document.addEventListener('visibilitychange',async()=>{ if(armed&&document.visibilityState==='visible'){ try{ wakeLock=await navigator.wakeLock?.request('screen'); }catch(e){} } });
</script>
</body>
</html>
